# agentdox local full-stack (for testing on Docker Desktop before the NAS)
#
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
#
# Services:
#   agentdox  - REST API (auth enabled, OIDC + PAT)
#   keycloak  - self-hosted OIDC IdP (realm auto-imported on first start)
#
# Networking note: agentdox reaches Keycloak at http://localhost:8080 via
# host-gateway, so tokens carry iss == http://localhost:8080/realms/agentdox —
# the SAME URL the host (browser/curl) uses. This keeps issuer validation consistent
# without a reverse proxy. For production on the NAS, see compose.proxy.yml.

name: agentdox

services:
  agentdox:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: agentdox/server:local
    container_name: agentdox-server
    restart: unless-stopped
    environment:
      PORT: "3003"
      AGENTDOX_AUTH_ENABLED: "${AGENTDOX_AUTH_ENABLED:-true}"
      AGENTDOX_ADMIN_TOKEN: "${AGENTDOX_ADMIN_TOKEN:?set AGENTDOX_ADMIN_TOKEN in deploy/.env}"
      # Single issuer = browser-visible URL. Keys are fetched via host.docker.internal
      # (browser and container resolve the same issuer; different reachability).
      AGENTDOX_OIDC_ISSUER: "http://localhost:8080/realms/agentdox"
      AGENTDOX_OIDC_JWKS_URI: "http://host.docker.internal:8080/realms/agentdox/protocol/openid-connect/certs"
      AGENTDOX_OIDC_CLIENT_ID: "${AGENTDOX_OIDC_CLIENT_ID:-agentdox-server}"
      AGENTDOX_OIDC_CLIENT_SECRET: "${AGENTDOX_OIDC_CLIENT_SECRET:-agentdox-server-dev-secret}"
      AGENTDOX_OIDC_AUDIENCE: "${AGENTDOX_OIDC_AUDIENCE:-}"
    # Access host-published Keycloak for JWKS.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AGENTDOX_PORT:-3003}:3003"
    # Bind the data dir to the host so the Docker server and host-side MCP/SDK clients
    # (e.g. an agent in another repo) share one SQLite store at $AGENTDOX_DATA_HOST.
    volumes:
      - "${AGENTDOX_DATA_HOST:-../data}:/app/data"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 15s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: agentdox-keycloak
    restart: unless-stopped
    # Realm is configured imperatively via deploy/scripts/setup_keycloak.py (robust + idempotent),
    # not the JSON import (which left the direct-grant flow in a broken state).
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in deploy/.env}"
      KC_HEALTH_ENABLED: "true"
      # Force a single issuer (http://localhost:8080/realms/agentdox) so browser and
      # in-container tokens validate identically against agentdox.
      KC_HOSTNAME: "localhost"
      KC_HOSTNAME_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # Keycloak's image has no curl/wget; use bash /dev/tcp against the HTTP port.
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8080 && echo ready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
