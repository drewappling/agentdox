# agentdox local full-stack (for testing on Docker Desktop before the NAS)
#
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
#
# Services:
#   agentdox  - REST API (auth enabled, OIDC + PAT)
#   keycloak  - self-hosted OIDC IdP (realm auto-imported on first start)
#
# Networking note: agentdox reaches Keycloak at http://localhost:8080 via
# host-gateway, so tokens carry iss == http://localhost:8080/realms/agentdox —
# the SAME URL the host (browser/curl) uses. This keeps issuer validation consistent
# without a reverse proxy. For production on the NAS, see compose.proxy.yml.

name: agentdox

services:
  agentdox:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: agentdox/server:local
    container_name: agentdox-server
    restart: unless-stopped
    environment:
      PORT: "3003"
      AGENTDOX_AUTH_ENABLED: "${AGENTDOX_AUTH_ENABLED:-true}"
      AGENTDOX_ADMIN_TOKEN: "${AGENTDOX_ADMIN_TOKEN:?set AGENTDOX_ADMIN_TOKEN in deploy/.env}"
      # Single issuer = browser-visible URL. Keys are fetched via host.docker.internal
      # (browser and container resolve the same issuer; different reachability).
      # KEYCLOAK_PORT is the host-published port (default 8090; was 8080 until that collided with the Unity MCP server).
      AGENTDOX_OIDC_ISSUER: "http://localhost:${KEYCLOAK_PORT:-8090}/realms/agentdox"
      AGENTDOX_OIDC_JWKS_URI: "http://host.docker.internal:${KEYCLOAK_PORT:-8090}/realms/agentdox/protocol/openid-connect/certs"
      AGENTDOX_OIDC_CLIENT_ID: "${AGENTDOX_OIDC_CLIENT_ID:-agentdox-server}"
      AGENTDOX_OIDC_CLIENT_SECRET: "${AGENTDOX_OIDC_CLIENT_SECRET:-agentdox-server-dev-secret}"
      AGENTDOX_OIDC_AUDIENCE: "${AGENTDOX_OIDC_AUDIENCE:-}"
      # Auto-context-update job (seconds between refreshes; 0 disables).
      AGENTDOX_CONTEXT_INTERVAL_SECONDS: "${AGENTDOX_CONTEXT_INTERVAL_SECONDS:-900}"
      # Retrieval embeddings. "none" (the default) keeps search lexical-only and makes no network
      # calls; "ollama" points at a model server on the DOCKER HOST, not inside this container.
      AGENTDOX_EMBED_PROVIDER: "${AGENTDOX_EMBED_PROVIDER:-none}"
      AGENTDOX_EMBED_MODEL: "${AGENTDOX_EMBED_MODEL:-nomic-embed-text}"
      AGENTDOX_EMBED_URL: "${AGENTDOX_EMBED_URL:-http://host.docker.internal:11434}"
      AGENTDOX_EMBED_API_KEY: "${AGENTDOX_EMBED_API_KEY:-}"
    # Access host-published Keycloak for JWKS.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AGENTDOX_PORT:-3003}:3003"
    # NOTE: keep the DB in an isolated named volume. Do NOT bind-mount the SQLite file onto the
    # host and share it with host-side processes (MCP/SDK) — Windows+Linux writers on one WAL file
    # over Docker Desktop's bind mount corrupts it. Cross-process sharing must go through the REST
    # API (HTTP), not a raw shared file.
    volumes:
      - agentdox-data:/app/data
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 15s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: agentdox-keycloak
    restart: unless-stopped
    # Realm is configured imperatively via deploy/scripts/setup_keycloak.py (robust + idempotent),
    # not the JSON import (which left the direct-grant flow in a broken state).
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in deploy/.env}"
      KC_HEALTH_ENABLED: "true"
      # Force a single issuer (http://localhost:8080/realms/agentdox) so browser and
      # in-container tokens validate identically against agentdox.
      KC_HOSTNAME: "localhost"
      KC_HOSTNAME_PORT: "${KEYCLOAK_PORT:-8090}"
    ports:
      - "${KEYCLOAK_PORT:-8090}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # Persist the realm DB (H2 under /opt/keycloak/data) across container recreates.
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      # Keycloak's image has no curl/wget; use bash /dev/tcp against the HTTP port.
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8080 && echo ready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  agentdox-data:
  keycloak-data:
